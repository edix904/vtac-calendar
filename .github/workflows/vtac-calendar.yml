name: Update VTAC calendar

on:
  schedule:
    - cron: "17 20 * * *"   # 20:17 UTC = ~6-7am Melbourne
  workflow_dispatch:
    inputs:
      allow_drop:
        description: "Publish even if the event count fell by more than half (a genuine VTAC change)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vtac-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest -v test_vtac_ical.py

      # Exit codes: 0 OK; 1 nothing written (fetch failed / too few events / sharp drop);
      # 2 written, but some events need attention (generic titles, unrecognised rounds,
      # implausible dates). 2 still publishes, then fails the job below so GitHub emails you.
      - name: Generate vtac.ics
        id: gen
        run: |
          set +e
          python vtac_ical.py --strict --out vtac.ics ${{ inputs.allow_drop && '--allow-drop' || '' }}
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit if dates changed
        if: steps.gen.outputs.code == '0' || steps.gen.outputs.code == '2'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vtac.ics
          if git diff --cached -I '^DTSTAMP' --quiet; then
            echo "No changes other than DTSTAMP; skipping commit."
            git reset -q vtac.ics
          else
            git commit -m "VTAC dates updated $(TZ=Australia/Melbourne date +%F)"
            git push
          fi

      # GitHub disables scheduled workflows after 60 days without repository activity, and
      # VTAC can go months without changing a date. Commit a heartbeat after 45 quiet days.
      - name: Keep the schedule alive
        if: always() && github.event_name == 'schedule'
        run: |
          git checkout -q -- . && git pull -q --rebase || true
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$age" -gt $((45 * 86400)) ]; then
            date -u +%F > .github/heartbeat
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/heartbeat
            git commit -m "Heartbeat: keep scheduled workflow active"
            git push
          else
            echo "Last commit $((age / 86400)) days ago; no heartbeat needed."
          fi

      - name: Fail if the parser needs attention
        if: steps.gen.outputs.code != '0'
        run: |
          if [ "${{ steps.gen.outputs.code }}" = "2" ]; then
            echo "::error::vtac.ics was published, but some events need attention. See the warnings above and the run summary."
          else
            echo "::error::vtac.ics was NOT updated. See the 'Generate vtac.ics' step log."
          fi
          exit 1
